# Pre-commit hooks
# https://pre-commit.com
#
# Instalar una vez por clon:
#   pip install pre-commit
#   pre-commit install
#
# A partir de ahi, ruff se ejecuta automaticamente en cada `git commit`
# sobre los ficheros Python modificados. La configuracion de reglas y
# formato vive en ruff.toml (raiz del repo).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      # Linter: detecta problemas y auto-arregla lo que puede (--fix)
      - id: ruff
        args: [--fix]
      # Formateador: aplica estilo uniforme (comillas, indentacion, etc.)
      - id: ruff-format
