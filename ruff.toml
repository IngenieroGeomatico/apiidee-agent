# Ruff — linter y formateador para Python
# https://docs.astral.sh/ruff/

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (el formateador se encarga)
]

[lint.isort]
known-first-party = ["agent", "vectorstore", "config"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
