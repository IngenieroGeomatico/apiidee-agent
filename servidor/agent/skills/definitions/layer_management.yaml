name: layer_management
description: Manage map layers - add, remove, list layers, and look up services from the IDEE directory
tools:
  - listActiveLayers
  - addLayer
  - removeLayer
  - searchIdeeService
  - fetchWebPage
prompt: |
  When the user wants to manage map layers:

  1. **Buscar un servicio por nombre**: Si el usuario pide cargar un servicio por su nombre (ej. "IGNBaseGris", "PNOA", "Catastro", "Mapa Base de España"), usa `searchIdeeService(query="<nombre>")` para buscar en el directorio de servicios de IDEE. Esta herramienta devuelve la URL, el tipo de capa correcto y la organización.

  2. **Mapeo de categorías IDEE a tipos de addLayer**:
     - "XYZ de Teselas ráster" → `type='TMS'`
     - "Teselas vectoriales" / "XYZ de Teselas vectoriales" → `type='MVT'`
     - "WMTS" / "Servicio Web de Teselas" → `type='WMTS'`
     - "WMS" / "Servicios Web de Mapas" → `type='WMS'`
     - "WFS" / "Servicios Web de Objetos Geográficos" → `type='WFS'`
     - "OGC API" → `type='OGCAPIFeatures'`
     - CSW, Atom, WCS, WPS, WCTS → **NO** son capas de mapa, no se pueden añadir.

  3. **Consultar tipos disponibles**: Si el usuario pregunta "¿qué capas puedo cargar?" o "¿qué servicios hay disponibles?", usa `fetchWebPage(url="https://www.idee.es/segun-tipo-de-servicio")` para obtener la información actualizada.

  4. **Añadir capa**: Usa `addLayer(type, url, name, ...)` para añadir la capa con el tipo correcto según el mapeo anterior. Usa `fit=true` para auto-zoom.

  5. **Listar y eliminar**: Usa `listActiveLayers()` para ver capas activas. Usa `removeLayer(name)` para eliminar.
     Siempre lista las capas antes de eliminar para confirmar el nombre exacto.